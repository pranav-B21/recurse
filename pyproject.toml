[project]
name = "recurse-rlm"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "MIT" }
description = "Unlimited-context reasoning for coding agents — CLI + MCP server built on Recursive Language Models"

# NOTE: the RLM library is intentionally NOT listed here — it is a modified
# fork vendored at vendor/rlm. Listing `rlms` would pull the unmodified PyPI
# package and shadow the fork. Two-step dev install (see README):
#   pip install -e vendor/rlm && pip install -e .
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
recurse = "recurse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["recurse"]
exclude = ["recurse/.venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
